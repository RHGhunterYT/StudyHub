<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--accent:#38bdf8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;margin:0;padding:0;overflow:auto}
.wrap{width:100%;max-width:420px;margin:24px auto;padding:16px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:36px;font-weight:800}
.scores{display:flex;gap:8px}
.pill{background:var(--card);padding:8px 14px;border-radius:12px;text-align:center;min-width:75px;border:1px solid color-mix(in srgb,var(--text)12%,transparent)}
.pill.label{font-size:11px;opacity:.7;text-transform:uppercase; letter-spacing:.5px}
.pill.val{font-size:20px;font-weight:700;color:var(--accent)}
.board{position:relative;width:100%;aspect-ratio:1;max-width:min(92vw,380px);margin:0 auto;background:var(--card);border-radius:16px}
.cell{position:absolute;background:color-mix(in srgb,var(--bg)85%,black);border-radius:10px}
.board{touch-action:none}
body{touch-action:pan-y}
.tile{position:absolute;display:grid;place-items:center;font-weight:800;border-radius:10px;transition:left.15s ease-out,top.15s ease-out;will-change:left,top;z-index:2;color:#001018}
.tile.new{animation:pop.15s}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.t2{background:color-mix(in srgb,var(--card)90%,white);color:var(--text)}
.t4{background:color-mix(in srgb,var(--card)70%,white);color:var(--text)}
.t8,.t16,.t32,.t64{background:var(--accent);color:#001018}
.t128{background:color-mix(in srgb,var(--accent)80%,#a855f7);color:white}
.t256{background:color-mix(in srgb,var(--accent)70%,#9333ea);color:white}
.t512{background:color-mix(in srgb,var(--accent)60%,#ec4899);color:white}
.t1024{background:color-mix(in srgb,var(--accent)90%,#f59e0b)}
.t2048{background:var(--accent);box-shadow:0 0 20px color-mix(in srgb,var(--accent)50%,transparent)}
.controls{display:flex;gap:8px;justify-content:center}
button{background:var(--card);color:var(--text);border:1px solid #334155;padding:10px 18px;border-radius:10px;font-weight:600}
button:active{transform:scale(.97)}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--bg)85%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;border-radius:16px;z-index:10}
.hint{text-align:center;opacity:.5;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>2048</h1><div class="scores"><div class="pill"><div class="label">Score</div><div class="val" id="score">0</div></div><div class="pill"><div class="label">Best</div><div class="val" id="best">0</div></div></div></header>
<div class="board" id="board"><div class="overlay" id="overlay" style="display:none"><div style="text-align:center"><h2 id="over-title" style="font-size:32px;margin-bottom:8px"></h2><p id="over-msg" style="opacity:.8;margin-bottom:12px"></p><button onclick="game.reset()">Play Again</button></div></div></div>
<div class="controls"><button onclick="game.reset()">New Game</button><button onclick="game.undo()">Undo</button></div>
<div class="hint">Swipe or arrow keys</div>
</div>
<script>
// theme sync
function applyTheme(){try{const t=JSON.parse(localStorage.getItem('theme')||'{}');for(const k in t)document.documentElement.style.setProperty('--'+k,t[k])}catch{}}
applyTheme();setInterval(applyTheme,1000);

window.focus();
document.body.tabIndex = 0;
document.body.focus();

const game=(()=>{
  const board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),ot=document.getElementById('over-title'),om=document.getElementById('over-msg');
  let grid,tiles,nextId,score,best=+(localStorage.getItem('2048-best')||0),history,won;

  bestEl.textContent=best;
  // make cells
  for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cell';board.appendChild(d)}
  function layout(){const s=board.clientWidth,pad=12,gap=12,ts=(s-pad*2-gap*3)/4;board.querySelectorAll('.cell').forEach((c,i)=>{const r=i>>2,co=i%4;c.style.width=c.style.height=ts+'px';c.style.left=pad+co*(ts+gap)+'px';c.style.top=pad+r*(ts+gap)+'px'});return{pad,gap,ts}}

  function init(){grid=Array(4).fill().map(()=>Array(4).fill(0));tiles={};nextId=1;score=0;history=[];won=false;overlay.style.display='none';board.querySelectorAll('.tile').forEach(t=>t.remove());add();add();render(true);scoreEl.textContent=0}
  function add(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])e.push([r,c]);if(!e.length)return;const [r,c]=e[Math.random()*e.length|0];const id=nextId++;grid[r][c]=id;tiles[id]={id,value:Math.random()<.9?2:4,r,c}}
  function save(){history.push({grid:grid.map(r=>[...r]),tiles:structuredClone(tiles),score,nextId});if(history.length>10)history.shift()}
  function undo(){if(!history.length)return;const h=history.pop();grid=h.grid;tiles=h.tiles;score=h.score;nextId=h.nextId;scoreEl.textContent=score;board.querySelectorAll('.tile').forEach(t=>t.remove());render(true)}

  // YOUR ORIGINAL MAP - kept exactly
  const map={ArrowLeft:0,ArrowUp:3,ArrowRight:2,ArrowDown:1};
  // vectors that match your map (0:left, 3:up, 2:right, 1:down)
  const vecs=[{r:0,c:-1},{r:1,c:0},{r:0,c:1},{r:-1,c:0}];

  function move(dir){
    save();
    const v=vecs[dir];
    const orderR=dir===3?[0,1,2,3]:dir===1?[3,2,1,0]:[0,1,2,3];
    const orderC=dir===0?[0,1,2,3]:dir===2?[3,2,1,0]:[0,1,2,3];
    let moved=false;const merged=new Set();
    orderR.forEach(r=>orderC.forEach(c=>{
      const id=grid[r][c];if(!id)return;
      let nr=r,nc=c;
      while(1){
        const tr=nr+v.r,tc=nc+v.c;if(tr<0||tr>3||tc<0||tc>3)break;
        if(!grid[tr][tc]){nr=tr;nc=tc;continue}
        if(tiles[grid[tr][tc]].value===tiles[id].value&&!merged.has(grid[tr][tc])){nr=tr;nc=tc;break}
        break;
      }
      if(nr!==r||nc!==c){
        moved=true;const target=grid[nr][nc];grid[r][c]=0;
        if(target){tiles[target].value*=2;score+=tiles[target].value;tiles[target].merged=true;merged.add(target);delete tiles[id];grid[nr][nc]=target;}
        else grid[nr][nc]=id;
        tiles[grid[nr][nc]].r=nr;tiles[grid[nr][nc]].c=nc;
      }
    }));
    if(moved){add();scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('2048-best',best)}render();checkEnd()}else history.pop();
  }

  function checkEnd(){
    if(!won&&Object.values(tiles).some(t=>t.value===2048)){won=true;ot.textContent='You Win!';om.textContent='Score '+score;overlay.style.display='grid';return}
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!grid[r][c])return;const v=tiles[grid[r][c]].value;if(c<3&&grid[r][c+1]&&tiles[grid[r][c+1]].value===v)return;if(r<3&&grid[r+1][c]&&tiles[grid[r+1][c]].value===v)return}
    ot.textContent='Game Over';om.textContent='Score '+score;overlay.style.display='grid';
  }

  function render(instant){
    const {pad,gap,ts}=layout();
    Object.values(tiles).forEach(t=>{
      let el=document.getElementById('t'+t.id);
      if(!el){el=document.createElement('div');el.id='t'+t.id;el.className='tile';board.appendChild(el)}
      el.className='tile t'+(t.value>2048?2048:t.value)+(t.merged?' new':'');
      el.textContent=t.value;
      el.style.width=el.style.height=ts+'px';
      el.style.fontSize=Math.max(16,ts*0.48)+'px';
      if(instant)el.style.transition='none';
      el.style.left=pad+t.c*(ts+gap)+'px';
      el.style.top=pad+t.r*(ts+gap)+'px';
      if(instant){el.offsetHeight;el.style.transition='';}
      t.merged=false;
    });
    board.querySelectorAll('.tile').forEach(el=>{if(!tiles[+el.id.slice(1)])el.remove()});
  }

  document.body.tabIndex = 0;
setTimeout(()=>document.body.focus(), 100);

const keyHandler = e => {
  if(map[e.key]!= null){ e.preventDefault(); e.stopPropagation(); move(map[e.key]) }
  if(e.key.toLowerCase() === 'r') init();
  if(e.key.toLowerCase() === 'u') undo();
};
window.addEventListener('keydown', keyHandler, true);
document.addEventListener('keydown', keyHandler, true);

let sx, sy;
board.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY }, {passive:true});
board.addEventListener('touchend', e => {
  if(sx == null) return;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) move(dx > 0? map.ArrowRight : map.ArrowLeft);
  else if(Math.abs(dy) > 30) move(dy > 0? map.ArrowDown : map.ArrowUp);
  sx = sy = null;
}, {passive:false});
  init();
  return{reset:init,undo};
})();
</script>
</body>
</html>
